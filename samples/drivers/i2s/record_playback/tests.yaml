sample:
  name: I2S record/playback sample
tests:
  sample.drivers.i2s.record_playback:
    tags: i2s
    filter: dt_nodelabel_enabled("audio_codec") and
            (dt_nodelabel_enabled("i2s_rxtx") or
             (dt_nodelabel_enabled("i2s_rx") and dt_nodelabel_enabled("i2s_tx")))
    platform_allow:
      - stm32h7s78_dk/stm32h7s7xx/ext_flash_app
    harness: console
    harness_config:
      type: one_line
      regex:
        - "I2S record/playback sample"
